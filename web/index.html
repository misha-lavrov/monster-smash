<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Побий монстра!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚔️%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Червоне попередження, коли сервер не відповідає (наприклад, перезапускається) -->
  <div id="banner" class="banner" hidden></div>

  <div class="card">

    <header>
      <div class="school">День відкритих дверей · гурток програмування</div>
      <h1>⚔️ <span id="hero">…</span> проти монстрів</h1>
      <div class="score">🏆 Переможено: <b id="kills">0</b></div>
    </header>

    <section id="arena" class="arena">
      <div class="monster-wrap"><div id="monster" class="monster">⏳</div></div>
      <div id="floaters" class="floaters"></div>
    </section>

    <div class="monster-info">
      <div id="monsterName" class="monster-name">…</div>
      <div class="hpbar">
        <div id="hpFill" class="hpfill" data-level="ok"></div>
        <span id="hpText">0 / 0</span>
      </div>
    </div>

    <button id="hitBtn" class="hit" type="button">⚔️ ВДАРИТИ <small>або натисни пробіл</small></button>

    <section class="talk">
      <h2>📡 Розмова браузера з Java-сервером</h2>
      <div id="log" class="log"></div>
    </section>

    <form id="flagForm" class="flag" autocomplete="off">
      <label for="flagInput">🚩 Знайшов прапорець?</label>
      <input id="flagInput" type="text" placeholder="OIPZ&#123;…&#125;" spellcheck="false" autocapitalize="off">
      <button type="submit">Здати</button>
    </form>
    <div id="flagMsg" class="flag-msg" hidden></div>

  </div>

  <!-- Вітання, коли прапорець знайдено -->
  <div id="win" class="win" hidden>
    <div class="win-card">
      <div class="win-emoji">🏆</div>
      <h2>Прапорець знайдено!</h2>
      <p>Вітаємо — це твоє перше CTF-завдання.<br>
         Так змагаються з кібербезпеки: <b>знайти сховане → здати → сервер перевіряє</b>.</p>
      <button type="button" id="winClose">Супер! Продовжити гру</button>
    </div>
  </div>

  <!--
     🕵️ Ого, ти зазирнув у код сторінки! Так роблять справжні дослідники кібербезпеки.
     Ось твій прапорець:   OIPZ{ctrl_u_is_a_superpower}
     Тепер введи його внизу гри, в поле «Знайшов прапорець?» — і побачиш, що буде!
  -->

  <script src="app.js"></script>
</body>
</html>
